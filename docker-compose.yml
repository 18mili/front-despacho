version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: front_despacho
    image: front_despacho:latest
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - BACKEND_HOST=${BACKEND_HOST}
    restart: unless-stopped
    networks:
      - frontend_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  frontend_network:
    driver: bridge
